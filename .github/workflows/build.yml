name: Yerel uygulama dosyasını hazırla

# Canlı yayın (GitHub Pages) yerine: tek dosyalık, yerelde çift tıkla açılan
# uygulamayı (dist/index.html) otomatik derler ve indirilebilir hale getirir.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      # Tek dosyayı anlaşılır bir isimle kopyala
      - run: cp dist/index.html mal-alim-takip.html

      # Her derlemede: Actions sekmesinden indirilebilir dosya
      - uses: actions/upload-artifact@v4
        with:
          name: mal-alim-takip-uygulama
          path: mal-alim-takip.html

      # Bir sürüm etiketi (v1.0 gibi) gönderilince: Releases'e otomatik ekle
      - name: Sürüm oluştur
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mal-alim-takip.html
