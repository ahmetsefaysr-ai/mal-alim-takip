name: Tek-tıklık uygulamayı hazırla

# Canlı yayın (GitHub Pages) yerine: Node gömülü, çift tıkla çalışan paketi
# her işletim sistemi için otomatik üretir. Çalıştırınca yerel sunucu başlar,
# tarayıcı açılır; veri diske (kullanıcı klasörü/MalAlimTakip) kaydedilir.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: mal-alim-takip-mac
            cmd: npm run build:mac
            file: MalAlimTakip-mac.zip
          - os: windows-latest
            artifact: mal-alim-takip-windows
            cmd: npm run build:app
            file: mal-alim-takip.exe
          - os: ubuntu-latest
            artifact: mal-alim-takip-linux
            cmd: npm run build:app
            file: mal-alim-takip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: ${{ matrix.cmd }}

      # Her derlemede: Actions sekmesinden indirilebilir çalıştırılabilir
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}

      # Sürüm etiketi (v1.0 gibi) gönderilince: Releases'e otomatik ekle
      - name: Sürüme ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.file }}
